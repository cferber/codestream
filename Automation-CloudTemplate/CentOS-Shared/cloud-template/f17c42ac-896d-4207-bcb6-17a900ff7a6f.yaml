name: CentOS-Shared
description: Provision default CentOS 8 server. Service is shared across multiple
  projects.
status: DRAFT
content: |
  ---
  formatVersion: 1
  inputs:
    cpu-number:
      type: "integer"
      title: "Number of CPUs"
      description: "Select number of CPU between 1 and 8. Note: 4 CPU and higher require\
        \ admin approval."
      default: 2
      minimum: 1
      maximum: 8
  resources:
    Cloud_Network_1:
      type: "Cloud.Network"
      metadata:
        layoutPosition:
        - 0
        - 0
      properties:
        networkType: "existing"
    centos:
      type: "Cloud.vSphere.Machine"
      metadata:
        layoutPosition:
        - 1
        - 1
      properties:
        image: "CentOS8"
        cpuCount: "${input.cpu-number}"
        itop: "yes"
        totalMemoryMB: 2048
        networks:
        - network: "${resource.Cloud_Network_1.id}"
          assignment: "static"
        storage:
          constraints:
          - tag: "env:on-prem"
        attachedDisks: []
valid: true
